services:

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    user: root   # bypasses the non-root permission issue on the mounted volume
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    volumes:
      - ./DATA/dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    user: root   # bind-mounted ./DATA/redpanda-data is root-owned — same fix as dynamodb-local
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
    volumes:
      - ./DATA/redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      # Sourced from the gitignored root .env — this file is public on GitHub.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Allow the browser (localhost:4200) to PUT/GET presigned URLs cross-origin (dev).
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./DATA/minio-data:/data

  opensearch:
    # Pinned (not :latest) — :latest rolled to 3.x, whose entrypoint runs the
    # security demo installer and requires OPENSEARCH_INITIAL_ADMIN_PASSWORD,
    # crash-looping on boot. 2.19.x is stable and matches the JS client we use.
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    environment:
      discovery.type: single-node
      # Local-dev only: no TLS, no auth (Search connects over plain http). Both
      # flags are required on 2.12+ — DISABLE_SECURITY_PLUGIN alone still runs the
      # demo installer, which is what aborts startup without an admin password.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      # Docker-managed named volume, NOT a host bind mount: OpenSearch runs as
      # uid 1000 and a root-owned bind-mount dir gives AccessDenied on data/nodes.
      # A fresh named volume inherits the image's uid-1000 ownership. (The index
      # is fully rebuildable from Kafka, so this isn't precious data anyway.)
      - opensearch-data:/usr/share/opensearch/data

  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack
    environment:
      SERVICES: s3,secretsmanager,kms
      DEBUG: 0
      # DEPRECATED and unused DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./DATA/localstack-data:/var/lib/localstack

  ws-shim:
    build:
      context: ./local-dev/ws-shim
    container_name: ws-shim
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      # Forward $connect/$disconnect/$default route events to Presence (Phase 3).
      - WS_SHIM_ROUTE_TARGET=http://presence-service:3000
    depends_on: [presence-service]

  # Local API gateway: ONE host for every client, path-routed, mirroring
  # services/web/proxy.conf.json. Exists so the Android client can use a single
  # base URL like it will in AWS, instead of seven host:port pairs that only exist
  # locally. Web keeps using the Angular dev proxy (same routes, same effect).
  gateway:
    image: nginx:1.27-alpine
    container_name: chat-gateway
    ports:
      - "8080:80"
    volumes:
      - ./local-dev/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local-dev/gateway/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    # Routes to the host's published ports rather than container DNS — see the
    # long comment in nginx.conf for why (nginx can't re-resolve a cached
    # upstream, so a recreated container silently misroutes).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
      - profile-service
      - messaging-service
      - presence-service
      - notification-service
      - media-service
      - search-service
      - ws-shim

  # ---- application services ----
  # Uncomment as each service is scaffolded. Each points src/adapters/httpServer.js
  # at the container ports above via env vars in local-env/.env

  auth-service:
    build: ./services/auth
    env_file: .env
    ports: ["3001:3000"]
    depends_on: [dynamodb-local, localstack]

  profile-service:
    build: ./services/profile
    env_file: .env
    ports: ["3002:3000"]
    depends_on: [dynamodb-local, redpanda]

  messaging-service:
    build: ./services/messaging-conversations
    env_file: .env
    ports: ["3003:3000"]
    depends_on: [dynamodb-local, redpanda, presence-service, ws-shim]

  presence-service:
    build: ./services/presence-connection
    env_file: .env
    ports: ["3004:3000"]
    depends_on: [dynamodb-local, redpanda]

  notification-service:
    build: ./services/notification
    env_file: .env
    ports: ["3005:3000"]
    depends_on: [dynamodb-local, redpanda]
    # Lets web-push reach a real push endpoint; also handy for local testing
    # against a host-run capture server (real push services are external anyway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Android push (FCM) needs a Firebase service-account key. Drop the JSON at
    # secrets/fcm-service-account.json (gitignored), set FCM_ENABLED=true in .env,
    # then uncomment. Left commented because a bind mount to a missing file makes
    # Docker create a DIRECTORY there, which then fails to parse as JSON.
    # volumes:
    #   - ./secrets/fcm-service-account.json:/run/secrets/fcm-service-account.json:ro

  media-service:
    build: ./services/media
    env_file: .env
    ports: ["3006:3000"]
    depends_on: [dynamodb-local, minio, redpanda]

  search-service:
    build: ./services/search
    env_file: .env
    ports: ["3007:3000"]
    depends_on: [opensearch, redpanda, messaging-service]

volumes:
  dynamodb-data:
    driver: local
  redpanda-data:
    driver: local
  minio-data:
    driver: local
  opensearch-data:
    driver: local
  localstack-data:
    driver: local

plugins {
    id 'com.android.application'
}

// Version comes from app/version.properties, which CI regenerates each release
// (VERSION_CODE auto-increments so Play accepts every upload). Local builds fall
// back to sensible defaults when the file is absent.
def versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('VERSION_CODE') ?: '1') as Integer
def appVersionName = versionProps.getProperty('VERSION_NAME') ?: '0.1'

android {
    namespace='dev.rstrickland.chat'
    compileSdk 34

    defaultConfig {
        applicationId "dev.rstrickland.chat"
        minSdk 26          // emulator + modern devices; 8.0+
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding=true   // generated binding classes — no findViewById boilerplate
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.3'
    implementation 'androidx.browser:browser:1.8.0' // Chrome Custom Tabs (Google Hosted-UI sign-in)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.5'

    // Networking — mirrors the web client's HttpClient + RxJS over the SAME endpoints.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}

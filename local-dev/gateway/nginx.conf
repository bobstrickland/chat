# Local API gateway — the dev stand-in for API Gateway (HTTP + WebSocket).
#
# WHY THIS EXISTS: the web client has always had a single-origin illusion via the
# Angular dev server's proxy.conf.json. Android had no equivalent, so its
# ApiConfig hardcoded seven host:port pairs — a topology that exists ONLY in local
# dev and looks nothing like the deployed shape (one hostname, path-routed). This
# gives every client one host in every environment, so client config differs by
# hostname alone.
#
# Route table mirrors services/web/proxy.conf.json. Keep the two in sync: they
# describe the same routing, and a path that works in the browser but not on the
# phone is exactly the "client-specific backend behaviour" the Client Contract
# forbids.
#
# NOT a fidelity model of API Gateway: no authorizer, no throttling, no request
# validation, no 128 KB frame cap. It only removes the port sprawl.

server {
  listen 80;
  server_name _;

  # Media metadata calls come through here (the bytes go straight to MinIO via
  # presigned URL); the default 1 MB body cap would reject larger requests.
  client_max_body_size 32m;

  # ---------------------------------------------------------------------------
  # TWO THINGS HERE ARE LOAD-BEARING. Both were learned the hard way; don't
  # "simplify" either one.
  #
  # 1. Upstreams are the HOST's PUBLISHED PORTS (host.docker.internal:3001…),
  #    not container DNS names. Container names look cleaner but break: nginx
  #    caches a resolved address and open-source nginx cannot re-resolve an
  #    `upstream` (that's an NGINX Plus feature). After
  #    `docker compose up -d --force-recreate`, containers get new IPs and the old
  #    ones get RECYCLED by other services — so the gateway silently routed
  #    /push/config to profile-service and returned its Express 404. Verified: the
  #    `resolver` + variable-in-proxy_pass workaround did NOT re-resolve either
  #    (Docker DNS was fresh, curl from inside the container worked, nginx stayed
  #    stale for 40s+ until a reload). Published host ports don't change when a
  #    container is recreated, so this is deterministic.
  #
  #    Yes, this means the port map lives here — but here is the ROUTING LAYER,
  #    which is the one place it belongs. Clients still see a single host.
  #
  #    Resolution happens once at startup, from /etc/hosts (the `extra_hosts`
  #    entry in docker-compose). That is FINE here precisely because the target is
  #    the bridge address, not a container. Note nginx's `resolver` cannot be used
  #    for this name at all — nginx queries DNS and never reads /etc/hosts, so a
  #    variable-in-proxy_pass form fails with "host.docker.internal could not be
  #    resolved".
  #
  # 2. NO URI PART on proxy_pass, and no variables. In this form nginx forwards the
  #    request URI byte-for-byte. Add a path (even a bare `/`) or use a variable and
  #    nginx rebuilds the URI from its DECODED copy — turning the `%23` in a
  #    conversationId (`dm#a#b`, `grp#uuid`) into a literal `#`, which truncates the
  #    path at the fragment and breaks every conversation route. Verified:
  #      $request_uri = /conversations/dm%23a%23b/messages   (raw, forwarded)
  #      $uri         = /conversations/dm#a#b/messages       (decoded, would break)
  # ---------------------------------------------------------------------------

  location /auth {
    proxy_pass http://host.docker.internal:3001;  # auth-service
    include /etc/nginx/proxy_common.conf;
  }

  location /profiles {
    proxy_pass http://host.docker.internal:3002;  # profile-service
    include /etc/nginx/proxy_common.conf;
  }

  location /contacts {
    proxy_pass http://host.docker.internal:3002;  # profile-service
    include /etc/nginx/proxy_common.conf;
  }

  location /conversations {
    proxy_pass http://host.docker.internal:3003;  # messaging-service
    include /etc/nginx/proxy_common.conf;
  }

  location /messages {
    proxy_pass http://host.docker.internal:3003;  # messaging-service
    include /etc/nginx/proxy_common.conf;
  }

  location /presence {
    proxy_pass http://host.docker.internal:3004;  # presence-service
    include /etc/nginx/proxy_common.conf;
  }

  location /device-tokens {
    proxy_pass http://host.docker.internal:3005;  # notification-service
    include /etc/nginx/proxy_common.conf;
  }

  location /push {
    proxy_pass http://host.docker.internal:3005;  # notification-service
    include /etc/nginx/proxy_common.conf;
  }

  location /media {
    proxy_pass http://host.docker.internal:3006;  # media-service
    include /etc/nginx/proxy_common.conf;
  }

  location /search {
    proxy_pass http://host.docker.internal:3007;  # search-service
    include /etc/nginx/proxy_common.conf;
  }

  # WebSocket. Clients connect to ws://{gateway}/ws?token=… ; ws-shim serves the
  # handshake at its root, so this is the one route that rewrites the path —
  # hence a literal "/" instead of $request_uri, with the query string appended.
  location /ws {
    # The one route that rewrites the path: ws-shim serves the handshake at its
    # root, so the trailing slash strips the /ws prefix. The query string (where
    # the JWT rides) is forwarded automatically.
    proxy_pass http://host.docker.internal:8090/;  # ws-shim
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # A chat socket is idle between messages; the 60s default would drop it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health { return 200 "gateway ok\n"; }
}

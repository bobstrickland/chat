# Shared proxy headers for the HTTP routes. Kept in one file so a header fix
# can't be applied to nine locations and missed on the tenth.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The Authorization header carries the bearer token every service verifies; it is
# forwarded by default, listed here only so nobody "cleans up" the header set and
# silently breaks auth.
proxy_pass_request_headers on;
